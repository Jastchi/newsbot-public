name: "Tests: Pytest [manual, self-hosted]"
# Can be triggered manually via workflow_dispatch.
# Runs all the tests for the project on a self-hosted runner.
# If a PR is open for the branch being tested, it will also
# create a check status on that PR.
# Note: The self-hosted runner must have Ollama and Docker installed

on:
  workflow_dispatch:  # Run manually

permissions:
  contents: write
  pull-requests: write
  statuses: write
  checks: write

jobs:
  test:
    runs-on: self-hosted
    environment: development

    services:
      postgres:
        # Keep the major version aligned with the Supabase project, so CI
        # exercises the engine production actually runs.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newsbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find open PR for branch
        id: pr
        uses: ./.github/actions/find-pr
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set status to running
        id: set_running
        if: steps.pr.outputs.pr_found == 'true'
        uses: ./.github/actions/update-pr-status
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sha: ${{ steps.pr.outputs.sha }}
          context: 'Tests (Self-hosted)'
          state: 'pending'
          description: 'Tests are running...'
          create-check-run: 'true'
      
      - name: Install dependencies
        run: uv sync

      - name: Install Playwright browsers
        run: uv run playwright install chromium

      - name: Write coverage config
        uses: ./.github/actions/setup-coverage-config
      
      - name: Run tests
        id: run_tests
        run: uv run pytest tests/ -q --tb=short --no-header --log-cli-level=CRITICAL --cov=src --cov-report=xml --cov-report=html
        env:
          DJANGO_SETTINGS_MODULE: web.web.settings
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/newsbot?sslmode=disable
          MOCK_OLLAMA: "false"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/**

      - name: Set final PR status
        if: always() && steps.pr.outputs.pr_found == 'true'
        uses: ./.github/actions/update-pr-status
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sha: ${{ steps.pr.outputs.sha }}
          context: 'Tests (Self-hosted)'
          state: ${{ steps.run_tests.outcome == 'success' && 'success' || 'failure' }}
          description: ${{ steps.run_tests.outcome == 'success' && 'All tests passed successfully' || 'Tests failed' }}
          check-run-id: ${{ steps.set_running.outputs.check-run-id }}
